name: Terraform Destroy Dev

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to destroy all dev infrastructure"
        required: true
        default: "NO"

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    if: github.event.inputs.confirm_destroy == 'DESTROY'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev

    env:
      AWS_REGION: ap-northeast-2
      EKS_CLUSTER_NAME: edf-cluster
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::398875891485:role/github-actions-terraform-role-edf
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Check cluster existence
        id: check_cluster
        shell: bash
        run: |
          if aws eks describe-cluster \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Update kubeconfig
        if: steps.check_cluster.outputs.exists == 'true'
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Stop ArgoCD reconciliation
        if: steps.check_cluster.outputs.exists == 'true'
        shell: bash
        run: |
          kubectl delete applications.argoproj.io --all \
            -n argocd \
            --ignore-not-found=true || true

      - name: Delete ALB Ingress
        if: steps.check_cluster.outputs.exists == 'true'
        shell: bash
        run: |
          kubectl delete ingress edf-api-ingress \
            -n edf \
            --ignore-not-found=true

          kubectl wait --for=delete ingress/edf-api-ingress \
            -n edf \
            --timeout=10m || true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan Destroy
        run: terraform plan -destroy -var-file="terraform.tfvars"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var-file="terraform.tfvars"
